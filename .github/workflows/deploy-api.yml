name: Deploy Worker API

# 推送接口代码时自动部署 Worker（名字：blog）
# 需要 Secret：CLOUDFLARE_API_TOKEN
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'worker-dist/**'
      - 'tools/deploy-cf.mjs'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 检查产物
        run: test -f worker-dist/index.js && echo "产物大小 $(wc -c < worker-dist/index.js) 字节"
      - name: 部署
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/deploy-cf.mjs
