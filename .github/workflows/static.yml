<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏选择器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>游戏选择器</h1>
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">已选择游戏数量：</span>
                <span class="stat-value" id="selected-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">已选择游戏大小：</span>
                <span class="stat-value" id="selected-size">0 GB</span>
            </div>
        </div>
        <div class="selected-games">
            <div class="selected-header">
                <h2>已选择的游戏序号：</h2>
                <button id="copy-button">复制序号</button>
            </div>
            <ul id="selected-ids"></ul>
        </div>
        <div class="table-container">
            <table id="game-table">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="select-all"></th>
                        <th>序号</th>
                        <th>游戏名称</th>
                        <th>大小 (GB)</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 游戏数据将通过JavaScript动态生成 -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
