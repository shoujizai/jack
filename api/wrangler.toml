# 接口 Worker 的部署配置（在 api 目录执行 wrangler deploy 即可）
# 名字必须和 auth.js 里的 API_BASE 对应：blog.318886406.workers.dev
name = "blog"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# 开启 workers.dev 地址（之前云端是关掉的，所以访问一直是 404）
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "jack-sjz"
database_id = "bd66ebe6-4575-4b98-9a26-bbf5b4456ddf"

[vars]
JWT_SECRET = "sjz-blog-2024-secret-key-x9k2m7p4q1"
ORDER_JSON_URL = "https://raw.gitcode.com/jack-sjz/sjz-aio/raw/main/resources/list.json"
