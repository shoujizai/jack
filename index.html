<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微修通讯游戏选择器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content-wrapper">
            <div class="left-panel">
                <div class="selected-games">
                    <div class="selected-header">
                        <h2>已选择的游戏：</h2>
                        <button id="copy-button">复制序号</button>
                    </div>
                    <div class="selected-ids-container">
                        <ul id="selected-ids"></ul>
                    </div>
                    <div class="note">点击序号复制发给淘宝客服和订单备注</div>
                </div>
            </div>
            <div class="right-panel">
                <div class="header-container">
                    <h1>微修通讯游戏预选</h1>
                    <div class="search-container">
                        <input type="text" id="search-input" placeholder="搜索游戏名称...">
                        <button id="search-button">搜索</button>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">已选择游戏数量：</span>
                        <span class="stat-value" id="selected-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">已选择游戏大小：</span>
                        <span class="stat-value" id="selected-size">0 GB</span>
                    </div>
                </div>
                <div class="table-container">
                    <table id="game-table">
                        <thead>
                            <tr>
                            <th>序号</th>
                            <th>游戏名称</th>
                            <th>大小 (GB)</th>
                            <th><input type="checkbox" id="select-all"></th>
                        </tr>
                        </thead>
                        <tbody>
                            <!-- 游戏数据将通过JavaScript动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
