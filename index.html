<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微修通讯游戏预选</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 70%;
            margin: 3px auto;
            padding: 8px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
        }
        
        .content-wrapper {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
        
        .left-panel {
            flex: 1;
            min-width: 100%;
        }
        
        .right-panel {
            flex: 1;
            min-width: 100%;
        }
        
        @media (min-width: 768px) {
            .content-wrapper {
                flex-direction: row;
            }
            .left-panel {
                flex: 5;
                min-width: 200px;
            }
            .right-panel {
                flex: 1;
                max-width: 450px;
                padding: 0 50px 0 20px;
            }
        }
        
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 8px;
        }
        
        @media (min-width: 768px) {
            .header-container {
                flex-direction: row;
                justify-content: flex-start;
                gap: 15px;
            }
        }
        
        h1 {
            margin-bottom: 4px;
            color: #4CAF50;
            font-size: 12px;
            flex: 1;
        }
        
        .search-container {
            margin-bottom: 0;
            display: flex;
            gap: 3px;
            flex: 1;
            max-width: 100%;
            width: 100%;
        }
        
        .search-input-wrapper {
            position: relative;
            flex: 1;
        }
        
        #search-input {
            width: 100%;
            max-width: 100%;
            padding: 4px 25px 4px 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 10px;
            box-sizing: border-box;
        }
        
        .clear-button {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #999;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .clear-button:hover {
            background-color: #f0f0f0;
            color: #333;
        }
        
        #search-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }
        
        #search-button:hover {
            background-color: #45a049;
        }
        
        .stats {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 4px;
            padding: 4px;
            background-color: #f9f9f9;
            border-radius: 3px;
            gap: 15px;
        }
        
        .stat-item {
            text-align: left;
        }
        
        .stat-label {
            font-weight: bold;
            margin-right: 1px;
            font-size: 9px;
        }
        
        .stat-value {
            color: #4CAF50;
            font-size: 10px;
            font-weight: bold;
        }
        
        .selected-games {
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        
        .note {
            font-size: 12px;
            color: #333;
            margin: 8px 0;
            font-style: italic;
            font-weight: bold;
            line-height: 1.4;
        }
        
        .selected-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }
        
        .selected-header h2 {
            margin: 0;
            color: #333;
            font-size: 11px;
        }
        
        #copy-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            min-height: 44px;
            min-width: 80px;
        }
        
        .ids-output {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 11px;
            min-height: 160px;
            width: 100%;
            background-color: #fff;
            color: #333;
            margin-top: 8px;
        }
        
        .table-container {
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        
        th, td {
            padding: 4px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 9px;
        }
        
        th {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        input[type="checkbox"] {
            transform: scale(1.2);
            cursor: pointer;
        }
        
        .selected-ids-container {
            max-height: 225px;
            overflow-y: auto;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 4px;
            background-color: #fff;
        }
        
        #selected-ids {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        
        #selected-ids li {
            background-color: #4CAF50;
            color: black;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
            margin-bottom: 4px;
            position: relative;
            padding-right: 25px;
        }
        
        .cancel-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: bold;
            color: rgba(0,0,0,0.7);
            cursor: pointer;
            width: 16px;
            height: 16px;
            text-align: center;
            line-height: 16px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-wrapper">
            <div class="left-panel">
                <div class="selected-games">
                    <div class="selected-header">
                        <h2>已选择的游戏：</h2>
                        <button id="copy-button">复制序号</button>
                    </div>
                    <textarea id="ids-output" readonly placeholder="选中的序号"></textarea>
                    <div class="selected-ids-container">
                        <ul id="selected-ids"></ul>
                    </div>
                    <div class="note">
                        1. 在顶部勾选您需要的游戏<br>
                        2. 点击顶部的"复制序号"按钮<br>
                        3. 将复制的序号粘贴发送给淘宝客服<br>
                        4. 256G只能装180g以内，512G只能装420g以内
                    </div>
                </div>
            </div>
            <div class="right-panel">
                <div class="header-container">
                    <h1>微修通讯游戏预选</h1>
                    <div class="search-container">
                        <div class="search-input-wrapper">
                            <input type="text" id="search-input" placeholder="搜索游戏名称...">
                            <button id="clear-button" class="clear-button">x</button>
                        </div>
                        <button id="search-button">搜索</button>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">已选择游戏数量：</span>
                        <span class="stat-value" id="selected-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">已选择游戏大小：</span>
                        <span class="stat-value" id="selected-size">0 GB</span>
                    </div>
                </div>
                <div class="table-container">
                    <table id="game-table">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>游戏名称</th>
                                <th>大小 (GB)</th>
                                <th><input type="checkbox" id="select-all"></th>
                            </tr>
                        </thead>
                        <tbody id="game-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
