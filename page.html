    <script>
        function start() {
            'use strict';

            var params = new URLSearchParams(location.search);
            var slug = (params.get('slug') || '').trim();

            var titleEl = document.getElementById('pageTitle');
            var subtitleEl = document.getElementById('pageSubtitle');
            var wrap = document.getElementById('blocksWrap');
            var stateEl = document.getElementById('pageState');

            function el(tag, cls, text) {
                var e = document.createElement(tag);
                if (cls) e.className = cls;
                if (text !== undefined && text !== null) e.textContent = text;
                return e;
            }

            // 基础富文本：支持 **加粗** 和换行
            function richText(container, text) {
                String(text || '')
                    .split(/\n+/)
                    .forEach(function (line, i) {
                        var p = el('p');
                        line.split(/(\*\*[^*]+\*\*)/g).forEach(function (part) {
                            if (/^\*\*[^*]+\*\*$/.test(part)) {
                                p.appendChild(el('strong', null, part.slice(2, -2)));
                            } else if (part) {
                                p.appendChild(document.createTextNode(part));
                            }
                        });
                        if (i > 0) p.style.marginTop = '10px';
                        container.appendChild(p);
                    });
            }

            function calloutClass(variant) {
                if (variant === 'warning') return 'warning-box';
                if (variant === 'info') return 'info-box';
                return 'step-box';
            }

            var currentCard = null;

            function newCard() {
                var card = el('div', 'content-section');
                wrap.appendChild(card);
                currentCard = card;
                return card;
            }

            function renderBlock(block) {
                var type = block && block.type;

                if (type === 'heading') {
                    var card = newCard();
                    card.appendChild(el('h2', null, block.text || ''));
                    return;
                }

                if (type === 'subheading') {
                    if (!currentCard) newCard();
                    currentCard.appendChild(el('h3', null, block.text || ''));
                    return;
                }

                if (!currentCard) newCard();

                if (type === 'paragraph') {
                    richText(currentCard, block.text || '');
                    return;
                }

                if (type === 'list') {
                    var list = el(block.ordered ? 'ol' : 'ul');
                    (block.items || []).forEach(function (item) {
                        if (String(item).trim()) list.appendChild(el('li', null, item));
                    });
                    currentCard.appendChild(list);
                    return;
                }

                if (type === 'callout') {
                    var box = el('div', calloutClass(block.variant));
                    if (block.title) box.appendChild(el('h4', null, block.title));
                    if (block.text) richText(box, block.text);
                    currentCard.appendChild(box);
                    return;
                }

                if (type === 'image') {
                    if (!block.src) return;
                    var fig = el('div');
                    fig.style.textAlign = 'center';
                    var img = el('img');
                    img.src = block.src;
                    img.alt = block.alt || '';
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.style.maxWidth = '100%';
                    img.style.borderRadius = '10px';
                    if (block.full) img.dataset.full = block.full;
                    fig.appendChild(img);
                    if (block.caption) {
                        var cap = el('p', null, block.caption);
                        cap.style.fontSize = '13px';
                        cap.style.color = 'var(--label-2)';
                        cap.style.marginTop = '8px';
                        fig.appendChild(cap);
                    }
                    currentCard.appendChild(fig);
                    return;
                }

                if (type === 'video') {
                    var vc = el('div', 'video-card');
                    if (block.title) vc.appendChild(el('p', 'video-card-title', block.title));
                    if (block.url) {
                        var a = el('a', 'btn-video', block.button || '观看视频');
                        a.href = block.url;
                        a.target = '_blank';
                        a.rel = 'noopener';
                        vc.appendChild(a);
                    }
                    if (block.hint) vc.appendChild(el('p', 'video-card-hint', block.hint));
                    currentCard.appendChild(vc);
                    return;
                }

                if (type === 'faq') {
                    (block.items || []).forEach(function (item) {
                        if (!item || (!item.q && !item.a)) return;
                        var itemBox = el('div', 'faq-item');
                        var q = el('div', 'faq-question');
                        q.appendChild(el('h4', null, item.q || ''));
                        var ans = el('div', 'faq-answer');
                        richText(ans, item.a || '');
                        itemBox.appendChild(q);
                        itemBox.appendChild(ans);
                        currentCard.appendChild(itemBox);
                    });
                    return;
                }

                if (type === 'table') {
                    var table = el('table', 'info-table');
                    if (block.head && block.head.length) {
                        var thead = el('thead');
                        var trh = el('tr');
                        block.head.forEach(function (h) {
                            trh.appendChild(el('th', null, h));
                        });
                        thead.appendChild(trh);
                        table.appendChild(thead);
                    }
                    var tbody = el('tbody');
                    (block.rows || []).forEach(function (row) {
                        var tr = el('tr');
                        row.forEach(function (cell) {
                            tr.appendChild(el('td', null, cell));
                        });
                        tbody.appendChild(tr);
                    });
                    table.appendChild(tbody);
                    currentCard.appendChild(table);
                    return;
                }

                if (type === 'divider') {
                    currentCard.appendChild(el('hr'));
                }
            }

            function showError(msg) {
                stateEl.textContent = msg;
                stateEl.style.color = 'var(--red)';
            }

            if (!slug) {
                titleEl.textContent = '页面不存在';
                showError('缺少页面参数，请从后台复制完整链接再打开。');
                return;
            }

            var base = window.API_BASE || '';
            var token = '';
            try {
                token = localStorage.getItem('auth_token') || '';
            } catch (e) {
                token = '';
            }

            // 带登录状态请求，便于管理员预览未发布的草稿
            fetch(base + '/api/pages?slug=' + encodeURIComponent(slug), {
                headers: token ? { Authorization: 'Bearer ' + token } : {},
            })
                .then(function (res) {
                    return res.json().then(function (data) {
                        return { ok: res.ok, status: res.status, data: data };
                    });
                })
                .then(function (r) {
                    if (!r.ok || !r.data || !r.data.title) {
                        titleEl.textContent = '页面不存在';
                        showError('没有找到这个页面（slug: ' + slug + '）。');
                        return;
                    }
                    var page = r.data;
                    document.title = page.title + ' - 微修的Blog';
                    titleEl.textContent = page.title;
                    subtitleEl.textContent = page.subtitle || '';
                    stateEl.remove();

                    var blocks = Array.isArray(page.blocks) ? page.blocks : [];
                    if (!blocks.length) {
                        newCard().appendChild(el('p', null, '（这个页面还没有内容）'));
                        return;
                    }
                    blocks.forEach(renderBlock);
                })
                .catch(function (e) {
                    titleEl.textContent = '加载失败';
                    showError('无法连接接口：' + e.message);
                });
        }

        // 等 auth.js（defer）执行完、拿到 window.API_BASE 后再渲染
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }
    </script>
