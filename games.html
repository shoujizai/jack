    <script>
        

        /* ---------- 勾选状态持久化：切换页面 / 刷新后自动恢复 ---------- */
        var SELECTED_STORAGE_KEY = 'jack_selected_games_v1';

        function loadSelectedGames() {
            try {
                var raw = localStorage.getItem(SELECTED_STORAGE_KEY);
                if (!raw) return [];
                var parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) return [];

                // 只保留仍然存在于游戏清单里的序号（防止数据更新后残留旧序号）
                var valid = [];
                for (var i = 0; i < parsed.length; i++) {
                    for (var j = 0; j < games.length; j++) {
                        if (String(games[j].id) === String(parsed[i])) {
                            valid.push(games[j].id);
                            break;
                        }
                    }
                }
                return valid;
            } catch (e) {
                return [];
            }
        }

        function saveSelectedGames() {
            try {
                localStorage.setItem(SELECTED_STORAGE_KEY, JSON.stringify(selectedGameIds));
            } catch (e) {
                /* 隐私模式或存储已满时静默失败 */
            }
        }

        var selectedGameIds = loadSelectedGames();
        var gameTbody = document.getElementById('gameTbody');
        var selectedIdsElement = document.getElementById('selectedIds');
        var selectAllCheckbox = document.getElementById('selectAll');
        var searchInput = document.getElementById('searchInput');
        var searchBtn = document.getElementById('searchBtn');
        var clearSearchBtn = document.getElementById('clearSearchBtn');
        var copyBtn = document.getElementById('copyBtn');

        function initGameTable(searchTerm) {
            searchTerm = searchTerm || '';
            gameTbody.innerHTML = '';
            
            var filteredGames = [];
            for (var i = 0; i < games.length; i++) {
                var game = games[i];
                if (!searchTerm || 
                    game.name.toLowerCase().indexOf(searchTerm.toLowerCase()) !== -1 ||
                    game.id.toLowerCase().indexOf(searchTerm.toLowerCase()) !== -1) {
                    filteredGames.push(game);
                }
            }
            
            for (var i = 0; i < filteredGames.length; i++) {
                var game = filteredGames[i];
                var row = document.createElement('tr');
                
                var tdCheck = document.createElement('td');
                var checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'game-checkbox';
                checkbox.setAttribute('data-id', game.id);
                
                for (var j = 0; j < selectedGameIds.length; j++) {
                    if (selectedGameIds[j] == game.id) {
                        checkbox.checked = true;
                        break;
                    }
                }
                
                tdCheck.appendChild(checkbox);
                
                var isSelected = false;
                for (var j = 0; j < selectedGameIds.length; j++) {
                    if (selectedGameIds[j] == game.id) {
                        isSelected = true;
                        break;
                    }
                }
                
                var tdId = document.createElement('td');
                var spanId = document.createElement('span');
                spanId.textContent = game.id;
                var idNum = parseInt(game.id);
                if (isSelected) {
                    spanId.className = 'selected';
                } else if (idNum >= 300) {
                    spanId.className = 'special-pink';
                }
                tdId.appendChild(spanId);
                
                var tdName = document.createElement('td');
                var spanName = document.createElement('span');
                spanName.textContent = game.name;
                if (isSelected) {
                    spanName.className = 'selected';
                } else if (idNum >= 300) {
                    spanName.className = 'special-pink';
                }
                tdName.appendChild(spanName);
                
                var tdSize = document.createElement('td');
                var spanSize = document.createElement('span');
                spanSize.textContent = game.size.toFixed(2);
                if (isSelected) {
                    spanSize.className = 'selected';
                } else if (idNum >= 300) {
                    spanSize.className = 'special-pink';
                }
                tdSize.appendChild(spanSize);
                
                if (isSelected) {
                    row.className = 'selected-row';
                }
                
                row.appendChild(tdCheck);
                row.appendChild(tdId);
                row.appendChild(tdName);
                row.appendChild(tdSize);
                gameTbody.appendChild(row);
            }
        }

        function updateStats() {
            var selectedCount = selectedGameIds.length;
            var selectedSize = 0;
            
            for (var i = 0; i < selectedGameIds.length; i++) {
                for (var j = 0; j < games.length; j++) {
                    if (games[j].id == selectedGameIds[i]) {
                        selectedSize += games[j].size;
                        break;
                    }
                }
            }
            
            var summaryTextElement = document.getElementById('summaryText');
            var selectedIdsFullElement = document.getElementById('selectedIdsFull');
            var expandIcon = document.getElementById('expandIcon');
            
            if (selectedGameIds.length === 0) {
                summaryTextElement.textContent = '暂未选择游戏';
                selectedIdsFullElement.textContent = '暂未选择游戏';
                expandIcon.style.display = 'none';
            } else {
                summaryTextElement.textContent = '已选 ' + selectedCount + ' 个游戏，总计 ' + selectedSize.toFixed(2) + ' GB';
                selectedIdsFullElement.textContent = getSelectedIdsText();
                expandIcon.style.display = 'inline';
            }
            
            updateSelectedIds();

            // 同步"全选"框状态（恢复勾选后不会显示成未选中）
            if (selectAllCheckbox) {
                var allBoxes = document.querySelectorAll('.game-checkbox');
                var checkedBoxes = document.querySelectorAll('.game-checkbox:checked');
                selectAllCheckbox.checked = allBoxes.length > 0 && allBoxes.length === checkedBoxes.length;
            }

            saveSelectedGames();
        }

        function updateSelectedIds() {
            selectedIdsElement.innerHTML = '';
            
            if (selectedGameIds.length === 0) {
                var hint = document.createElement('li');
                hint.className = 'empty-hint';
                hint.textContent = '请从下方列表勾选游戏...';
                selectedIdsElement.appendChild(hint);
                return;
            }
            
            for (var i = 0; i < selectedGameIds.length; i++) {
                var id = selectedGameIds[i];
                var game = null;
                
                for (var j = 0; j < games.length; j++) {
                    if (games[j].id == id) {
                        game = games[j];
                        break;
                    }
                }
                
                if (game) {
                    var li = document.createElement('li');
                    
                    var gameName = document.createElement('span');
                    gameName.className = 'game-name';
                    gameName.textContent = game.name;
                    li.appendChild(gameName);
                    
                    var cancelBtn = document.createElement('span');
                    cancelBtn.className = 'cancel-btn';
                    cancelBtn.textContent = 'x';
                    cancelBtn.setAttribute('data-id', id);
                    
                    cancelBtn.onclick = function(e) {
                        var targetId = this.getAttribute('data-id');
                        var newIds = [];
                        for (var k = 0; k < selectedGameIds.length; k++) {
                            if (selectedGameIds[k] != targetId) {
                                newIds.push(selectedGameIds[k]);
                            }
                        }
                        selectedGameIds = newIds;
                        
                        var checkbox = document.querySelector('.game-checkbox[data-id="' + targetId + '"]');
                        if (checkbox) {
                            checkbox.checked = false;
                            var row = checkbox.closest('tr');
                            var spans = row.querySelectorAll('td span');
                            var targetIdNum = parseInt(targetId);
                            for (var i = 0; i < spans.length; i++) {
                                spans[i].classList.remove('selected');
                                if (targetIdNum >= 300) {
                                    spans[i].classList.add('special-pink');
                                }
                            }
                            row.classList.remove('selected-row');
                        }
                        
                        updateStats();
                    };
                    
                    li.appendChild(cancelBtn);
                    selectedIdsElement.appendChild(li);
                }
            }
        }

        function updateSelectedGameIds() {
            var checkboxes = document.querySelectorAll('.game-checkbox');
            var displayedGameIds = [];
            var checkedGameIds = [];
            
            for (var i = 0; i < checkboxes.length; i++) {
                var checkbox = checkboxes[i];
                var id = checkbox.getAttribute('data-id');
                displayedGameIds.push(id);
                if (checkbox.checked) {
                    checkedGameIds.push(id);
                }
            }
            
            var newSelectedIds = [];
            for (var i = 0; i < selectedGameIds.length; i++) {
                var id = selectedGameIds[i];
                var isDisplayed = false;
                for (var j = 0; j < displayedGameIds.length; j++) {
                    if (displayedGameIds[j] == id) {
                        isDisplayed = true;
                        break;
                    }
                }
                if (!isDisplayed) {
                    newSelectedIds.push(id);
                }
            }
            
            for (var i = 0; i < checkedGameIds.length; i++) {
                var id = checkedGameIds[i];
                var found = false;
                for (var j = 0; j < newSelectedIds.length; j++) {
                    if (newSelectedIds[j] == id) {
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    newSelectedIds.push(id);
                }
            }
            
            selectedGameIds = newSelectedIds;
        }

        function getSelectedIdsText() {
            var ids = [];
            for (var i = 0; i < selectedGameIds.length; i++) {
                ids.push(selectedGameIds[i]);
            }
            return ids.join(' ');
        }

        function copyToClipboard(text, onSuccess, onError) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    if (onSuccess) onSuccess();
                }).catch(function(err) {
                    fallbackCopy(text, onSuccess, onError);
                });
            } else {
                fallbackCopy(text, onSuccess, onError);
            }
        }

        function fallbackCopy(text, onSuccess, onError) {
            var textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '50%';
            textArea.style.top = '50%';
            textArea.style.transform = 'translate(-50%, -50%)';
            textArea.style.opacity = '0';
            textArea.style.width = '2em';
            textArea.style.height = '2em';
            textArea.style.padding = '0';
            textArea.style.border = 'none';
            textArea.style.outline = 'none';
            textArea.style.boxShadow = 'none';
            textArea.style.background = 'transparent';
            textArea.setAttribute('readonly', '');
            document.body.appendChild(textArea);
            
            try {
                var isIOS = navigator.userAgent.match(/ipad|ipod|iphone/i);
                if (isIOS) {
                    var range = document.createRange();
                    range.selectNodeContents(textArea);
                    var selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(range);
                    textArea.setSelectionRange(0, 999999);
                } else {
                    textArea.focus();
                    textArea.select();
                }
                
                var successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                
                if (successful) {
                    if (onSuccess) onSuccess();
                } else {
                    if (onError) onError();
                }
            } catch (err) {
                document.body.removeChild(textArea);
                if (onError) onError();
            }
        }

        function performSearch() {
            var searchTerm = searchInput.value;
            initGameTable(searchTerm);
        }

        function init() {
            // 先用本地 games-data.js 立刻渲染（秒开、不怕接口挂）
            startUi();
            // 再尝试用接口的数据刷新（3 秒超时，失败就保持本地数据）
            try {
                var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
                if (ctrl) setTimeout(function () { ctrl.abort(); }, 3000);
                fetch('https://api.jacksjz.qzz.io/api/games', ctrl ? { signal: ctrl.signal } : undefined)
                    .then(function (r) {
                        return r.ok ? r.json() : null;
                    })
                    .then(function (data) {
                        if (!data || !Array.isArray(data.games) || !data.games.length) return;
                        var fresh = data.games.map(function (g) {
                            return { id: g.id, name: g.name, size: Number(g.size) || 0 };
                        });
                        window.games = fresh;
                        try {
                            games = fresh;
                        } catch (e) {
                            /* 忽略 */
                        }
                        initGameTable();
                        updateStats();
                    })
                    .catch(function () {
                        /* 接口不可用：保持本地数据，不打扰用户 */
                    });
            } catch (e) {
                /* 忽略 */
            }
        }

        function startUi() {
            initGameTable();
            updateStats();
            
            var selectedIdsSummary = document.getElementById('selectedIdsSummary');
            var selectedIdsFull = document.getElementById('selectedIdsFull');
            var expandIcon = document.getElementById('expandIcon');
            var isExpanded = false;
            
            selectedIdsSummary.onclick = function() {
                isExpanded = !isExpanded;
                if (isExpanded) {
                    selectedIdsFull.style.display = 'block';
                    expandIcon.textContent = '▲';
                } else {
                    selectedIdsFull.style.display = 'none';
                    expandIcon.textContent = '▼';
                }
            };
            
            selectAllCheckbox.onclick = function() {
                var checkboxes = document.querySelectorAll('.game-checkbox');
                for (var i = 0; i < checkboxes.length; i++) {
                    checkboxes[i].checked = this.checked;
                }
                
                var allSpans = document.querySelectorAll('.games-table td span');
                for (var i = 0; i < allSpans.length; i++) {
                    if (this.checked) {
                        allSpans[i].classList.remove('special-pink');
                        allSpans[i].classList.add('selected');
                    } else {
                        allSpans[i].classList.remove('selected');
                    }
                }
                
                var allRows = document.querySelectorAll('.games-table tbody tr');
                for (var i = 0; i < allRows.length; i++) {
                    if (this.checked) {
                        allRows[i].classList.add('selected-row');
                    } else {
                        allRows[i].classList.remove('selected-row');
                    }
                }
                
                if (!this.checked) {
                    for (var i = 0; i < checkboxes.length; i++) {
                        var id = checkboxes[i].getAttribute('data-id');
                        var idNum = parseInt(id);
                        if (idNum >= 300) {
                            var row = checkboxes[i].closest('tr');
                            var spans = row.querySelectorAll('td span');
                            for (var j = 0; j < spans.length; j++) {
                                spans[j].classList.add('special-pink');
                            }
                        }
                    }
                }
                
                updateSelectedGameIds();
                updateStats();
            };

            gameTbody.onclick = function(e) {
                if (e.target.className === 'game-checkbox') {
                    var checkbox = e.target;
                    var row = checkbox.closest('tr');
                    var spans = row.querySelectorAll('td span');
                    var gameId = checkbox.getAttribute('data-id');
                    var idNum = parseInt(gameId);
                    
                    for (var i = 0; i < spans.length; i++) {
                        if (checkbox.checked) {
                            spans[i].classList.remove('special-pink');
                            spans[i].classList.add('selected');
                        } else {
                            spans[i].classList.remove('selected');
                            if (idNum >= 300) {
                                spans[i].classList.add('special-pink');
                            }
                        }
                    }
                    
                    if (checkbox.checked) {
                        row.classList.add('selected-row');
                    } else {
                        row.classList.remove('selected-row');
                    }
                    
                    updateSelectedGameIds();
                    updateStats();
                    
                    var allCheckboxes = document.querySelectorAll('.game-checkbox');
                    var checkedCheckboxes = document.querySelectorAll('.game-checkbox:checked');
                    selectAllCheckbox.checked = allCheckboxes.length === checkedCheckboxes.length;
                }
            };

            copyBtn.onclick = function(e) {
                e.preventDefault();
                
                var idsText = getSelectedIdsText();
                
                if (!idsText || idsText.trim() === '') {
                    alert('请先选择游戏！');
                    return;
                }
                
                copyToClipboard(idsText, function() {
                    copyBtn.textContent = '复制成功！';
                    setTimeout(function() {
                        copyBtn.textContent = '复制序号';
                    }, 2000);
                }, function() {
                    alert('复制失败，请手动复制：' + idsText);
                });
            };

            searchInput.oninput = function() {
                performSearch();
            };

            searchBtn.onclick = function() {
                performSearch();
            };

            searchInput.onkeypress = function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            };

            clearSearchBtn.onclick = function() {
                searchInput.value = '';
                performSearch();
            };
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
